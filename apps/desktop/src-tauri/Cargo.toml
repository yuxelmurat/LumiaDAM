[package]
name = "lumiadam-desktop"
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/yuxelmurat/LumiaDAM"

[lib]
name = "lumiadam_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lumiadam-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = ["protocol-asset", "devtools", "tray-icon"] }
tauri-plugin-shell = "=2.4.1"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-fs = "=2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
base64 = "=0.22.1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
notify = "6"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
walkdir = "2"
mime_guess = "2"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", features = ["jpeg", "png", "tiff", "bmp", "gif", "tga", "webp"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
trash = "5"
exav-render = { version = "=0.0.2", default-features = false, features = ["dwg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
